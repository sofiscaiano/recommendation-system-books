[project]
name = "sr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "implicit>=0.7.3",
    "ipykernel>=7.3.0",
    "joblib>=1.5.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.3.3",
    "optuna>=4.5.0",
    "pandas>=3.0.5",
    "plotly>=6.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.2",
    "typer>=0.16.0",
    "mlflow>=3.16.1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quelibroleo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
