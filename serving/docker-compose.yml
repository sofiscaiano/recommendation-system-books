services:
  api:
    build:
      context: ..
      dockerfile: serving/Dockerfile
    environment:
      SERVING_ARTIFACT: /models/serving.joblib
      SERVING_DB: /data/data.db
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    volumes:
      - ../artifacts/serving.joblib:/models/serving.joblib:ro
      - ../data.db:/data/data.db:ro
    ports:
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Definí TUNNEL_TOKEN en serving/.env}
    depends_on:
      - api
    profiles:
      - tunnel
